<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Reactive Shader Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel">
        <h1>Audio Reactive Shader Lab</h1>
        <p>
          Load a song (or use your microphone) and watch a full-screen shader
          react to bass, mids, treble, and overall energy in real time.
        </p>

        <label class="control-group" for="audioFile">
          <span>Music file</span>
          <input id="audioFile" type="file" accept="audio/*" />
        </label>

        <div class="control-group inline">
          <button id="playBtn" disabled>Play</button>
          <button id="pauseBtn" disabled>Pause</button>
          <button id="micBtn">Use microphone</button>
        </div>

        <label class="control-group" for="sensitivity">
          <span>Sensitivity: <strong id="sensitivityValue">1.00</strong></span>
          <input
            id="sensitivity"
            type="range"
            min="0.2"
            max="2"
            value="1"
            step="0.01"
          />
        </label>

        <label class="control-group" for="colorShift">
          <span>Color shift: <strong id="colorShiftValue">0.35</strong></span>
          <input
            id="colorShift"
            type="range"
            min="0"
            max="1"
            value="0.35"
            step="0.01"
          />
        </label>

        <div id="status" class="status">No audio source connected.</div>

        <div class="metrics">
          <div><span>Bass:</span> <strong id="bassValue">0.00</strong></div>
          <div><span>Mids:</span> <strong id="midsValue">0.00</strong></div>
          <div><span>Treble:</span> <strong id="trebleValue">0.00</strong></div>
          <div><span>Energy:</span> <strong id="energyValue">0.00</strong></div>
        </div>
      </section>

      <canvas id="glCanvas" aria-label="Audio reactive shader"></canvas>
    </main>

    <audio id="player" preload="auto"></audio>
    <script src="app.js"></script>
  </body>
</html>
